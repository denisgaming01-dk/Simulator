<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die-Cutter Simulator</title>
<style>body{font:16px system-ui,sans-serif;background:#F4F3EE;color:#222;display:grid;place-items:center;min-height:100vh;margin:0}
.box{max-width:560px;padding:24px;text-align:center}.box b{display:block;font-size:20px;margin-bottom:8px}.box small{display:block;margin-top:12px;color:#666;font-size:12px;text-align:left;white-space:pre-wrap}</style>
</head>
<body>
<div class="box" id="msg"><b>Die-Cutter Simulator</b>Loading the newest version…</div>
<script>
/* Send this file once. Each time it opens it loads loader.js fresh from jsDelivr, and loader.js loads the newest simulator. */
(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/denisgaming01-dk/Simulator@main/loader.js?t='+Date.now();
 s.onerror=function(){document.getElementById('msg').innerHTML='<b>Die-Cutter Simulator</b>The simulator could not be loaded. Check the internet connection, or ask your trainer.';};
 document.head.appendChild(s);})();
</script>
</body>
</html>
