<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die-Cutter Simulator</title>
<style>body{font:16px system-ui,sans-serif;background:#F4F3EE;color:#222;display:grid;place-items:center;min-height:100vh;margin:0}
.box{max-width:560px;padding:24px;text-align:center}.box b{display:block;font-size:20px;margin-bottom:8px}.box small{display:block;margin-top:12px;color:#666;font-size:12px;text-align:left;white-space:pre-wrap}</style>
</head>
<body>
<div class="box" id="msg"><b>Die-Cutter Simulator</b>Loading the newest version…</div>
<script>
/* Launcher: loads the newest simulator each time it is opened, so this file never has to be sent again.
   jsDelivr first (it gets through company filters that block GitHub), GitHub Pages as the second choice. */
var SRC=[
 'https://cdn.jsdelivr.net/gh/denisgaming01-dk/Simulator@main/index.html',
 'https://denisgaming01-dk.github.io/Simulator/index.html'
];
var notes=[];
function show(h){document.open();document.write(h);document.close();}
function fail(){document.getElementById('msg').innerHTML='<b>Die-Cutter Simulator</b>The simulator could not be loaded. Open this file in Microsoft Edge or Chrome (not in a preview window) and check the internet connection.<small>'+notes.join('\n')+'</small>';}
function get(i){
 if(i>=SRC.length){fail();return;}
 var u=SRC[i],x=new XMLHttpRequest(),done=false;
 var t=setTimeout(function(){if(done)return;done=true;try{x.abort();}catch(e){}notes.push(u+': timed out');get(i+1);},12000);
 x.onload=function(){if(done)return;done=true;clearTimeout(t);
  var h=x.responseText||'';
  if(x.status>=200&&x.status<300&&h.indexOf('Flatbed Die-Cutter Simulator')>=0){show(h);}
  else{notes.push(u+': '+x.status+(h.indexOf('Flatbed')<0?' (not the simulator, maybe a block page)':''));get(i+1);}};
 x.onerror=function(){if(done)return;done=true;clearTimeout(t);notes.push(u+': blocked or no connection');get(i+1);};
 try{x.open('GET',u,true);x.send();}catch(e){done=true;clearTimeout(t);notes.push(u+': '+e.message);get(i+1);}
}
get(0);
</script>
</body>
</html>
