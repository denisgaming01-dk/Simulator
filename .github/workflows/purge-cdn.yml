# After every push: tag the commit with the simulator version (from the badge, e.g. v171 -> 1.171.0)
# and ask jsDelivr to refresh, so the launcher gets the new version even where github.io is blocked.
name: Refresh jsDelivr copy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this version
        run: |
          V=$(grep -o 'class="ver"[^>]*>v[0-9]*' index.html | grep -o 'v[0-9]*$' | tr -d v)
          N=$(git rev-list --count HEAD)
          TAG="1.${V:-0}.${N}"
          echo "tag $TAG"
          git tag "$TAG" && git push origin "$TAG" || echo "tag exists"
      - name: Purge jsDelivr cache
        run: |
          sleep 20
          for f in index.html Simulator-Launcher.html; do
            curl -fsS "https://purge.jsdelivr.net/gh/denisgaming01-dk/Simulator@main/$f" || true
            echo
          done
          curl -fsS "https://purge.jsdelivr.net/gh/denisgaming01-dk/Simulator@latest/index.html" || true
